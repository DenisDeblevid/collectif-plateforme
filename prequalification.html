<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Préqualification NORIA</title>
<style>
/* VOICE : calme, professionnel, rassurant — un guide d'appel qu'on tient en main
   IDEA : le carnet d'entretien du conseiller NORIA, page par page
   PICTURE : la question en grand, la note juste dessous, la fiche qui se remplit
   COLOUR and TYPE : bleu nuit et pétrole, cuivre en accent, sable ; Georgia pour les questions
   LAYOUT : étapes à gauche, carnet au centre, fiche prospect à droite (empilés sur téléphone) */
:root{--nuit:#0B3544;--petrole:#234B5E;--cuivre:#B86F4C;--bronze:#E3A47F;--sable:#F4EFE6;--sable2:#E8DCC9;--encre:#1C2E36}
*{box-sizing:border-box;min-width:0}
body{margin:0;font:16px/1.55 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--encre);background:var(--sable);overflow-x:clip}
header{background:radial-gradient(circle at 85% -20%,#2f6178,var(--petrole) 40%,var(--nuit));color:#fff;padding:22px max(4vw,16px)}
.h-in{max-width:1240px;margin:0 auto;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.logo{height:58px;background:var(--sable);padding:7px 14px;border-radius:12px}
.h-txt{flex:1}
.h-txt small{font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--bronze);font-weight:700}
h1{font-family:Georgia,serif;font-weight:400;font-size:clamp(1.5rem,3vw,2.1rem);margin:2px 0 0;line-height:1.15}
.h-btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:inherit;font-size:.86rem;font-weight:700;border-radius:999px;padding:10px 18px;cursor:pointer;border:1px solid transparent;min-height:44px}
.btn-c{background:var(--cuivre);color:#fff}
.btn-c:hover{background:#A45B38}
.btn-o{background:none;border-color:rgba(255,255,255,.5);color:#fff}
.btn-l{background:#fff;border-color:var(--sable2);color:var(--petrole)}
.wrap{max-width:1240px;margin:0 auto;padding:24px max(4vw,16px) 60px;display:grid;grid-template-columns:220px minmax(0,1fr) 300px;gap:26px;align-items:start}
.etapes{position:sticky;top:16px;display:flex;flex-direction:column;gap:6px}
.etape{font:inherit;text-align:left;background:none;border:0;border-radius:12px;padding:10px 12px;cursor:pointer;color:var(--encre);display:flex;gap:10px;align-items:center;font-size:.9rem;min-height:44px}
.etape .pt{width:26px;height:26px;border-radius:50%;border:2px solid var(--sable2);display:inline-flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;color:var(--petrole);flex-shrink:0;background:#fff}
.etape.ok .pt{background:var(--petrole);border-color:var(--petrole);color:#fff}
.etape[aria-current=step]{background:#fff;box-shadow:0 1px 0 var(--sable2)}
.etape[aria-current=step] .pt{border-color:var(--cuivre);color:var(--cuivre)}
.carnet{background:#fff;border:1px solid var(--sable2);border-radius:22px;padding:clamp(20px,3vw,34px);min-height:420px}
.sec-titre{font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--cuivre);font-weight:700;margin:0 0 4px}
.sec-sous{font-family:Georgia,serif;font-size:1.5rem;color:var(--nuit);margin:0 0 20px;font-weight:400}
.q{border-top:1px solid var(--sable2);padding:20px 0 6px}
.q:first-of-type{border-top:0;padding-top:4px}
.q-num{display:inline-block;font-weight:700;color:var(--cuivre);margin-right:6px}
.q-texte{font-family:Georgia,serif;font-size:1.22rem;line-height:1.4;color:var(--nuit);margin:0 0 8px}
.q-conseil{font-size:.86rem;color:#5d6d73;margin:0 0 10px;padding-left:12px;border-left:3px solid var(--sable2)}
.ajout{display:inline-block;font-size:.66rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--petrole);color:#fff;padding:3px 8px;border-radius:999px;margin-left:6px;vertical-align:middle}
textarea,input[type=text],input[type=email]{width:100%;font:inherit;font-size:16px;border:1px solid var(--sable2);border-radius:12px;padding:10px 12px;background:var(--sable);color:var(--encre)}
textarea{min-height:76px;resize:vertical}
textarea:focus,input:focus{outline:2px solid var(--bronze);outline-offset:1px;background:#fff}
.choix{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.choix button{font:inherit;font-size:.9rem;border:1px solid var(--sable2);background:#fff;border-radius:999px;padding:9px 16px;cursor:pointer;min-height:44px;color:var(--encre)}
.choix button[aria-pressed=true]{background:var(--cuivre);border-color:var(--cuivre);color:#fff;font-weight:700}
.alerte{background:#FBF1EA;border:1px solid #EBC9B3;border-radius:14px;padding:12px 14px;font-size:.88rem;margin:10px 0}
.alerte b{color:var(--cuivre)}
.prop{background:var(--nuit);color:#fff;border-radius:18px;padding:20px 22px;margin:6px 0 14px}
.prop h3{font-family:Georgia,serif;font-weight:400;color:var(--bronze);margin:0 0 8px;font-size:1.25rem}
.prop p{margin:0 0 10px;color:rgba(255,255,255,.9)}
.prop .script{background:rgba(255,255,255,.07);border-left:3px solid var(--bronze);padding:10px 14px;border-radius:8px;font-style:italic}
.prop ul{margin:6px 0 0;padding-left:18px;color:rgba(255,255,255,.85);font-size:.9rem}
.prop .blanc{color:var(--bronze);font-weight:700}
.obj{border:1px solid var(--sable2);border-radius:14px;margin-bottom:8px;background:var(--sable)}
.obj summary{cursor:pointer;padding:12px 14px;font-weight:600;min-height:44px}
.obj p{margin:0;padding:0 14px 12px;font-size:.92rem}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:24px;flex-wrap:wrap}
.fiche{position:sticky;top:16px;background:var(--petrole);color:#fff;border-radius:20px;padding:20px}
.fiche h2{font-family:Georgia,serif;font-weight:400;font-size:1.2rem;margin:0 0 12px;color:var(--bronze)}
.fiche dl{margin:0;font-size:.85rem}
.fiche dt{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--bronze);margin-top:10px;font-weight:700}
.fiche dd{margin:2px 0 0;color:rgba(255,255,255,.9);white-space:pre-wrap;overflow-wrap:anywhere}
.fiche dd.vide{color:rgba(255,255,255,.4);font-style:italic}
.fiche .btn{width:100%;margin-top:14px}
.ok-msg{font-size:.8rem;color:var(--bronze);text-align:center;margin-top:6px;min-height:1.2em}
.tarifs{font-size:.8rem;color:#6b7a80;margin-top:18px}
@media (max-width:1060px){.wrap{grid-template-columns:minmax(0,1fr) 280px}.etapes{grid-column:1/-1;position:static;flex-direction:row;overflow-x:auto}.etape{flex:0 0 auto}}
@media (max-width:760px){.wrap{grid-template-columns:minmax(0,1fr)}.fiche{position:static}.h-btns{width:100%}.h-btns .btn{flex:1}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

 ]},
 {id:'s1',court:'1 · Ouverture',titre:'Section 1',sous:'Ouverture',q:[

 ]},

  ['« C’est trop cher. »','Comprendre d’abord : trop cher par rapport à quoi ? Rappeler que l’offre Pionniers est à '+T.pionMois+' '+T.pionDuree+', sans engagement : on peut arrêter à tout moment.'],

 {id:'s5',court:'Fiche finale',titre:'Fin d’entretien',sous:'Relire, copier, envoyer',fin:true,q:[

const etat={i:0,v:{}};
try{const s=JSON.parse(localStorage.getItem('noria-prequal')||'null');if(s&&s.v)Object.assign(etat,s);}catch(e){}
const sauver=()=>{try{localStorage.setItem('noria-prequal',JSON.stringify(etat));}catch(e){}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);
const choixHtml=(id,l)=>'<div class="choix">'+l.map(o=>'<button type="button" data-k="'+id+'" data-o="'+esc(o)+'" aria-pressed="'+(etat.v[id]===o)+'">'+esc(o)+'</button>').join('')+'</div>';
function proposition(){
  const p=etat.v.q22, besoin=etat.v.q21_note?'« '+esc(etat.v.q21_note)+' »':'<span class="blanc">ce qu’elle a dit en 2.1</span>';
  const pion='l’offre Pionniers : <b>'+T.pionMois+' '+T.pionDuree+'</b> (au lieu de '+T.pionApres+'), puis '+T.pionApres+', <b>sans engagement</b>, dans la limite des 30 places de lancement';
  if(!p) return '<div class="prop"><h3>Choisir d’abord le palier en 2.2</h3><p>La proposition adaptée s’affichera ici.</p></div>';
  if(p==='Moins de 50 €') return '<div class="prop"><h3>Palier : moins de 50 €</h3><p>Proposer '+pion+'.</p><p class="script">« Vous m’avez dit vouloir faire évoluer '+besoin+'. Avec l’offre Pionniers, vous avez accès chaque mois aux Sessions Horizon, aux Cercles NORIA, à une question Ask NORIA et aux ressources pratiques, pour '+T.pionMois+'. »</p></div>';
  if(p==='Entre 50 et 100 €') return '<div class="prop"><h3>Palier : entre 50 et 100 €</h3><p>1. Proposer '+pion+'.</p><p>2. Puis l’abonnement individuel : <b>'+T.stdMois+'</b> sans engagement, ou <b>'+T.stdAn+'</b> (soit 118 € de moins que douze mensualités).</p><p class="script">« Pour travailler sur '+besoin+', le plus simple est de commencer avec l’offre Pionniers. Si les places sont prises, l’abonnement individuel donne exactement les mêmes accès. »</p></div>';
  const engage=etat.v.q23==='Oui'?' Elle s’est dite prête à un suivi sur plusieurs semaines (2.3) : appuyez-vous dessus.':(etat.v.q23?' Attention : en 2.3, elle a répondu « '+esc(etat.v.q23)+' » à un suivi régulier.':'');
  return '<div class="prop"><h3>Palier : plus de 100 €</h3><p>1. Proposer d’abord l’<b>accompagnement individualisé, sur devis</b> : un parcours construit pour la personne, sur une plus longue période (formation, accompagnement, coaching), avec un ou plusieurs experts NORIA.'+engage+'</p><p>2. En cas d’hésitation, revenir à '+pion+'.</p><p class="script">« Vous m’avez parlé de '+besoin+'. Pour aller plus loin, nous pouvons construire avec vous un accompagnement individualisé, sur la durée, avec les experts NORIA les plus adaptés. Je vous propose de préparer une proposition sur devis. »</p></div>';
}
function rendre(){
  const s=S[etat.i];
  $('#etapes').innerHTML=S.map((x,k)=>'<button type="button" class="etape'+(k<etat.i?' ok':'')+'" data-e="'+k+'"'+(k===etat.i?' aria-current="step"':'')+'><span class="pt">'+(k<etat.i?'✓':k)+'</span>'+esc(x.court)+'</button>').join('');
  let h='<p class="sec-titre">'+esc(s.titre)+(s.ajout?' <span class="ajout">Ajout proposé</span>':'')+'</p><h2 class="sec-sous">'+esc(s.sous)+'</h2>';
  if(s.prop) h+=proposition();
  if(s.obj) h+=s.obj.map(o=>'<details class="obj"><summary>'+esc(o[0])+'</summary><p>'+esc(o[1])+'</p></details>').join('');
  (s.q||[]).forEach(q=>{
    h+='<div class="q"><p class="q-texte">'+(q.n?'<span class="q-num">'+q.n+'</span>':'')+esc(q.t)+(q.ajout&&!s.ajout?'<span class="ajout">Ajout proposé</span>':'')+'</p>';
    if(q.c) h+='<p class="q-conseil">'+esc(q.c)+'</p>';
    if(q.choix) h+=choixHtml(q.id,q.choix);
    if(q.choix2) h+=choixHtml(q.id+'_b',q.choix2);
    if(q.alerte) h+='<div class="alerte">'+q.alerte+(q.alerteAjout?' <span class="ajout">Ajout proposé</span>':'')+'</div>';
    if(q.sansNote){h+='</div>';return;}
    const k=q.type==='text'?q.id:q.id+'_note';
    h+=q.type==='text'?'<input type="text" data-n="'+k+'" value="'+esc(etat.v[k])+'" aria-label="'+esc(q.t)+'">':'<textarea data-n="'+k+'" aria-label="Notes '+esc(q.n||q.t)+'" placeholder="Notes…">'+esc(etat.v[k])+'</textarea>';
    h+='</div>';
  });
  if(s.fin) h+='<p class="tarifs">Relisez la fiche à droite, puis copiez-la (pour Brevo ou la boîte NORIA) et copiez le mail de confirmation à envoyer à la personne.</p>';
  h+='<div class="nav">'+(etat.i>0?'<button class="btn btn-l" type="button" data-go="-1">← Précédent</button>':'<span></span>')+(etat.i<S.length-1?'<button class="btn btn-c" type="button" data-go="1">Suivant →</button>':'')+'</div>';
  h+='<p class="tarifs">Tarifs vérifiés sur le site le 27/11/2026 : Pionniers '+T.pionMois+' '+T.pionDuree+' puis '+T.pionApres+' (30 places, sans engagement) · Individuel '+T.stdMois+' ou '+T.stdAn+'.</p>';
  $('#carnet').innerHTML=h; fiche(); sauver();
}
const champs=[['Civilité','civ'],['Prénom et nom','nom'],['Accord notes','q0'],['Présentation','q02_note'],['Situation','situation'],['Structure et poste','poste'],['Équipe encadrée','equipe'],['Domaine','direction'],['Financement','financement'],['Connu par','source'],['1.1 Blocage','q11_note'],['1.2 Déjà tenté','q12_note'],['1.3 Dans un an','q13_note'],['2.1 Point à faire évoluer','q21_note'],['2.1 CONTINUUM adapté ?','q21'],['2.2 Palier','q22'],['2.3 Suivi régulier','q23'],['3.1 Démarrer ?','q31'],['3.2 Suite','q32_note'],['3.3 Contact','q33'],['Suite à donner','suite_note']];
function fiche(){$('#fiche').innerHTML=champs.map(([l,k])=>'<dt>'+esc(l)+'</dt><dd'+(etat.v[k]?'':' class="vide"')+'>'+esc(etat.v[k]||'—')+'</dd>').join('');}
const texteFiche=()=>'FICHE PROSPECT NORIA · '+new Date().toLocaleDateString('fr-FR')+'\n'+champs.map(([l,k])=>l+' : '+(etat.v[k]||'—')).join('\n');
const texteMail=()=>'Bonjour'+(etat.v.civ&&etat.v.nom?' '+etat.v.civ+' '+etat.v.nom.trim().split(/\s+/).slice(-1)[0]:(etat.v.nom?' '+etat.v.nom:''))+',\n\nMerci pour notre échange. Comme convenu, voici un récapitulatif.\n\nCe que vous souhaitez faire évoluer : '+(etat.v.q21_note||'…')+'\nLa suite : '+(etat.v.q32_note||'…')+'\n\nPour rappel, l’offre Pionniers CONTINUUM est à '+T.pionMois+' '+T.pionDuree+', puis '+T.pionApres+', sans engagement (dans la limite des 30 places de lancement).\n\nJe reste à votre disposition.\n\nBien cordialement,\nNORIA HORIZON';
async function copier(t,msg){try{await navigator.clipboard.writeText(t);$('#okMsg').textContent=msg;}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();let ok=false;try{ok=document.execCommand('copy');}catch(_){}a.remove();$('#okMsg').textContent=ok?msg:'Copie impossible ici : sélectionnez le texte de la fiche à la main.';}setTimeout(()=>$('#okMsg').textContent='',3500);}
document.addEventListener('click',e=>{
  const c=e.target.closest('[data-k]'); if(c){const k=c.dataset.k;etat.v[k]=etat.v[k]===c.dataset.o?'':c.dataset.o;rendre();return;}
  const g=e.target.closest('[data-go]'); if(g){etat.i=Math.max(0,Math.min(S.length-1,etat.i+ +g.dataset.go));rendre();window.scrollTo({top:0,behavior:'smooth'});return;}
  const t=e.target.closest('[data-e]'); if(t){etat.i=+t.dataset.e;rendre();}
});
document.addEventListener('input',e=>{const n=e.target.dataset&&e.target.dataset.n;if(n){etat.v[n]=e.target.value;fiche();sauver();if(n==='q21_note'&&S[etat.i].prop)rendre();}});
$('#copier').addEventListener('click',()=>copier(texteFiche(),'Fiche copiée.'));
$('#copierMail').addEventListener('click',()=>copier(texteMail(),'Mail copié.'));
$('#nouveau').addEventListener('click',()=>{if(Object.values(etat.v).some(Boolean)&&!document.getElementById('nouveau').dataset.sur){const b=document.getElementById('nouveau');b.dataset.sur='1';b.textContent='Confirmer : tout effacer ?';setTimeout(()=>{b.textContent='Nouvel appel';delete b.dataset.sur;},3000);return;}etat.i=0;etat.v={};const b=document.getElementById('nouveau');b.textContent='Nouvel appel';delete b.dataset.sur;rendre();});
rendre();
}
</script>
</body>
</html>
